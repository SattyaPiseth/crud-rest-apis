plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'sattya.piseth'
version = '0.0.1-SNAPSHOT'
description = 'crud-rest-apis'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework:spring-aspects'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('outboxOpsProcess', JavaExec) {
    group = 'verification'
    description = 'Run the test-only persistent outbox operational harness.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'sattya.piseth.crudrestapis.outbox.publication.PersistentOutboxOpsProcess'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(27)
    }
    systemProperty 'outbox.ops.mode', providers.gradleProperty('outboxOpsMode').getOrElse('ack')
    systemProperty 'outbox.ops.seed', providers.gradleProperty('outboxOpsSeed').getOrElse('false')
}

tasks.register('migrateDatabase', JavaExec) {
    group = 'database'
    description = 'Run Flyway with separate migration credentials from environment variables.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'sattya.piseth.crudrestapis.infrastructure.migration.DatabaseMigrator'
}

// JaCoCo 0.8.16 officially supports Java 27 class files.
jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
