spring:
  application:
    name: crud-rest-apis
  flyway:
    # Runtime credentials deliberately have no DDL permissions.
    enabled: false
  # Supply SPRING_DATASOURCE_URL/USERNAME/PASSWORD outside local development.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: Asia/Phnom_Penh
  sql:
    init:
      mode: never
  datasource:
    # Starting values for a small application; tune against measured workload.
    hikari:
      data-source-properties:
        # Suppress PostgreSQL row/parameter details in exceptions before application handling.
        logServerErrorDetail: false
      connection-init-sql: "SET TIME ZONE 'Asia/Phnom_Penh'"
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      max-lifetime: 1800000

logging:
  level:
    # Provider exception logs bypass the sanitized API diagnostic boundary.
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.SQL: OFF
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Phnom_Penh"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# REST access remains closed until trusted JWT settings are supplied (see docs).
app:
  api:
    enabled: false

  # No transport adapter is shipped. Enable only after trusted tenant/role provisioning.
  outbox:
    enabled: false
